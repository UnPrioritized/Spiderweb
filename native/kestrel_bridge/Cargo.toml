[package]
name = "kestrel_bridge"
version = "0.3.0"
edition = "2021"
publish = false
description = "Spiderweb's live connection to the Kestrel GPU synth: a C ABI over Kestrel's live render"

[lib]
# cdylib = the DLL Spiderweb loads with ctypes; rlib = for this crate's own tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
# Kestrel = mbms's fork (live interface + "runs inside another process" fix) + our own changes on the branch
# "spiderweb" of github.com/UnPrioritized/kestrel-midi, pinned to one commit. Updating: see the kestrel-update skill.

# (Windows: DirectX 12 through its shader compiler, as Kestrel's own builds; Linux: Vulkan)
[target.'cfg(windows)'.dependencies]
kestrel = { git = "https://github.com/UnPrioritized/kestrel-midi", rev = "0c1e198ba5e3ac8a1217d21147d223c5c01d4c96", default-features = false, features = ["dx12-dxc"] }

[target.'cfg(not(windows))'.dependencies]
kestrel = { git = "https://github.com/UnPrioritized/kestrel-midi", rev = "0c1e198ba5e3ac8a1217d21147d223c5c01d4c96", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
